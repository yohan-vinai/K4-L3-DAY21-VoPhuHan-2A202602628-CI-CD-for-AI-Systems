name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'tests/**.py'
      - 'scripts/**.py'
      - 'params.yaml'
      - 'requirements.txt'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Pull training data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          f1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1=$f1" >> "$GITHUB_OUTPUT"

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json

      - name: Save release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            models/model.joblib
            src/serve.py
            src/__init__.py

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check F1 quality gate
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PY'
          import os

          f1 = float(os.environ["F1"])
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Deployment blocked.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65.")
          PY

  release:
    name: Release
    needs: [train, quality-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download approved model bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-bundle

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload approved release to Amazon S3
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
        run: python scripts/upload_release.py

      - name: Restart EC2 service through Systems Manager
        run: python scripts/release_ssm.py
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
